workflows:
  ios-unsigned-workflow:
    name: Build Unsigned iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      groups:
        - async_secrets
    scripts:
      - name: Install npm dependencies
        script: |
          cd Frontend
          npm install
      - name: Run Expo Prebuild
        script: |
          cd Frontend
          npx expo prebuild --platform ios --clean
      - name: Build Unsigned iOS App
        script: |
          cd Frontend/ios
          set -o pipefail
          xcodebuild -workspace ASync.xcworkspace \
            -scheme ASync \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build
      - name: Package into IPA
        script: |
          cd Frontend/ios
          mkdir -p Payload
          echo "Searching for .app file..."
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Simulator" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found!"
            exit 1
          fi
          echo "Copying $APP_PATH to Payload/"
          cp -R "$APP_PATH" Payload/
          zip -qr app.ipa Payload
    artifacts:
      - Frontend/ios/app.ipa
