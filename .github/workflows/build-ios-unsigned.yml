name: Build Unsigned iOS IPA
on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "271566804440-u7gm5a3lo29kdguq069quflptm67nrdc.apps.googleusercontent.com"
      EXPO_PUBLIC_ANDROID_CLIENT_ID: "271566804440-hn986qevqbuj4kkbrfj9p5jk36r7qnqi.apps.googleusercontent.com"
      EXPO_PUBLIC_IOS_CLIENT_ID: "271566804440-6vv0ibjg7iagif6alqq20in544vt1dqs.apps.googleusercontent.com"
      EXPO_PUBLIC_IOS_URL_SCHEME: "com.googleusercontent.apps.271566804440-6vv0ibjg7iagif6alqq20in544vt1dqs"
      EXPO_PUBLIC_API_BASE_URL: "https://async-server.vercel.app"
      EXPO_PUBLIC_ORIGIN: "app://async.android"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Prebuild iOS project
        working-directory: ./Frontend
        run: npx expo prebuild --platform ios --clean

      - name: Build Unsigned iOS App
        working-directory: ./Frontend/ios
        run: |
          # Use wildcards or exact names depending on what Expo generates. Expo usually uses the "name" from app.config.js
          xcodebuild -workspace ASync.xcworkspace \
            -scheme ASync \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build | xcpretty

      - name: Package into IPA
        working-directory: ./Frontend/ios
        run: |
          mkdir -p Payload
          # Find the generated .app file and copy it into the Payload folder
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASync-Unsigned-IPA
          path: Frontend/ios/app.ipa

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS Unsigned IPA Build #${{ github.run_number }}
          files: Frontend/ios/app.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
